openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Serena — Sistema de Gestión Funeraria API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agent
    description: AI agent operations
  - name: inventory
    description: Inventory management
  - name: policies
    description: Policy management
  - name: catalog
    description: Product and category registration
  - name: operations
    description: Validation, evaluation, and imports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Enviar mensaje al agente Serena (streaming SSE)
      description: Sends a message to the Serena AI agent and returns a streaming SSE response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatInput"
      responses:
        "200":
          description: Streaming SSE response
          content:
            text/event-stream:
              schema:
                type: string

  /inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: Obtener estado del inventario
      description: Returns current inventory state for all categories
      responses:
        "200":
          description: Current inventory state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryState"
    put:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Actualizar estado de un item del inventario
      description: Updates the status of an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdateInput"
      responses:
        "200":
          description: Updated inventory state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryState"

  /policies:
    get:
      operationId: getPolicies
      tags: [policies]
      summary: Obtener todas las pólizas
      description: Returns all insurance policies in the system
      responses:
        "200":
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"

  /policies/{cedula}:
    get:
      operationId: getPolicyByCedula
      tags: [policies]
      summary: Buscar póliza por cédula
      description: Looks up a policy by the policyholder's ID number
      parameters:
        - name: cedula
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/dashboard:
    get:
      operationId: getCatalogDashboard
      tags: [catalog]
      summary: Obtener categorías, productos y resultados recientes
      responses:
        "200":
          description: Datos del módulo de registro y evaluación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDashboard"

  /catalog/categories:
    post:
      operationId: createCatalogCategory
      tags: [catalog]
      summary: Registrar una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCategoryInput"
      responses:
        "201":
          description: Categoría registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCategory"
        "400":
          description: Datos inválidos o código/nombre duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/products:
    post:
      operationId: createCatalogProduct
      tags: [catalog]
      summary: Registrar un producto con categoría, código y cantidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogProductInput"
      responses:
        "201":
          description: Producto registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "400":
          description: Datos inválidos o código duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /operations/evaluate:
    post:
      operationId: evaluateCatalogCode
      tags: [operations]
      summary: Evaluar un código de producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCodeInput"
      responses:
        "200":
          description: Evaluación aprobada o rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"

  /operations/verify:
    post:
      operationId: verifyCatalogCode
      tags: [operations]
      summary: Verificar si un código corresponde a un producto registrado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogCodeInput"
      responses:
        "200":
          description: Resultado de verificación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationResult"

  /operations/import:
    post:
      operationId: importCatalogProducts
      tags: [operations]
      summary: Cargar productos desde un archivo CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportInput"
      responses:
        "200":
          description: Resumen de filas aprobadas y rechazadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogImportResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AgentChatInput:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant, system]
              content:
                type: string
            required: [role, content]
        sessionId:
          type: string
          nullable: true
      required: [messages]

    InventoryState:
      type: object
      properties:
        salas:
          type: object
          additionalProperties:
            type: string
        vehiculos:
          type: object
          additionalProperties:
            type: string
        cofres:
          type: object
          additionalProperties:
            type: number
      required: [salas, vehiculos, cofres]

    InventoryUpdateInput:
      type: object
      properties:
        categoria:
          type: string
          enum: [salas, vehiculos, cofres]
        item:
          type: string
        valor:
          type: string
      required: [categoria, item, valor]

    Policy:
      type: object
      properties:
        cedula:
          type: string
        titular:
          type: string
        aseguradora:
          type: string
        plan:
          type: string
        limite_usd:
          type: number
        estatus:
          type: string
        cobertura:
          type: array
          items:
            type: string
        telefono_aseguradora:
          type: string
          nullable: true
        contacto_aseguradora:
          type: string
          nullable: true
      required: [cedula, titular, aseguradora, plan, limite_usd, estatus, cobertura]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    CatalogCategory:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, code, name, createdAt]

    CatalogCategoryInput:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 24 }
        name: { type: string, minLength: 2, maxLength: 80 }
      required: [code, name]

    CatalogProduct:
      type: object
      properties:
        id: { type: integer }
        categoryId: { type: integer }
        categoryName: { type: string }
        code: { type: string }
        name: { type: string }
        quantity: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, categoryId, categoryName, code, name, quantity, createdAt]

    CatalogProductInput:
      type: object
      properties:
        categoryId: { type: integer, minimum: 1 }
        code: { type: string, minLength: 2, maxLength: 32 }
        name: { type: string, minLength: 2, maxLength: 120 }
        quantity: { type: integer, minimum: 0 }
      required: [categoryId, code, name, quantity]

    CatalogCodeInput:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 32 }
      required: [code]

    OperationResult:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        productId: { type: ["integer", "null"] }
        productCode: { type: ["string", "null"] }
        productName: { type: ["string", "null"] }
        status: { type: string, enum: [Aprobado, Rechazado] }
        responseCode: { type: string }
        responseMessage: { type: string }
        responseTimeMs: { type: integer }
        sourceFileName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, action, productId, productCode, productName, status, responseCode, responseMessage, responseTimeMs, sourceFileName, createdAt]

    VerificationResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/OperationResult"
        product:
          oneOf:
            - $ref: "#/components/schemas/CatalogProduct"
            - type: "null"
      required: [result, product]

    CatalogImportRow:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string }
        quantity: { type: integer }
      required: [code, name, category, quantity]

    CatalogImportInput:
      type: object
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/CatalogImportRow"
      required: [fileName, rows]

    CatalogImportResult:
      type: object
      properties:
        fileName: { type: string }
        totalRows: { type: integer }
        approvedRows: { type: integer }
        rejectedRows: { type: integer }
        responseTimeMs: { type: integer }
        results:
          type: array
          items:
            $ref: "#/components/schemas/OperationResult"
      required: [fileName, totalRows, approvedRows, rejectedRows, responseTimeMs, results]

    CatalogDashboard:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategory"
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        events:
          type: array
          items:
            $ref: "#/components/schemas/OperationResult"
        summary:
          type: object
          properties:
            categoryCount: { type: integer }
            productCount: { type: integer }
            approvedCount: { type: integer }
            rejectedCount: { type: integer }
          required: [categoryCount, productCount, approvedCount, rejectedCount]
      required: [categories, products, events, summary]
